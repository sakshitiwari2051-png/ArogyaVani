[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arogyavani-backend"
version = "1.0.0"
description = "ArogyaVani: Sovereign Indic Voice AI Health Helpline powered by Gnani.ai & LiveKit Agents"
requires-python = ">=3.10, <3.15"

dependencies = [
    "aiosqlite>=0.20.0",
    "httpx>=0.25.0",
    "livekit-agents[deepgram,google,silero,turn-detector]~=1.4",
    "livekit-murf>=0.1.1",
    "livekit-plugins-groq>=1.4.5",
    "livekit-plugins-openai>=1.4.5",
    "livekit-plugins-noise-cancellation~=0.2",
    "mcp>=1.2.0,<1.4.0",
    "python-dotenv",
    "gnani-vachana>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_temp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
